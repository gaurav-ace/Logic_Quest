name: Daily reminder

# Posts a short reminder to the owner's Discord channel: once in the morning (04:00 to 12:00 IST,
# usually early) and once in the evening (17:00 to 23:00 IST, or skipped). GitHub starts scheduled
# runs hours late (4 to 5.5 hours in October 2026), so each slot has several attempts, and the
# Decide step lets only the first one inside its window post. Times are UTC (IST is UTC+5:30, no
# daylight saving). In a public repo, schedules pause after 60 days with no activity (re-enable
# from the Actions tab). The cron lines must match CRON in src/reminder/message.ts.
on:
  schedule:
    # Morning: 00:00, 01:00 ... 06:00 IST.
    - cron: '30 18 * * *'
    - cron: '30 19 * * *'
    - cron: '30 20 * * *'
    - cron: '30 21 * * *'
    - cron: '30 22 * * *'
    - cron: '30 23 * * *'
    - cron: '30 0 * * *'
    # Evening: 17:00, 18:00, 19:00 IST.
    - cron: '30 11 * * *'
    - cron: '30 12 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Which message to send
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: read
  # To read this workflow's earlier runs, so a slot posts only once a day.
  actions: read

# One run at a time, so a run always sees whether the one before it posted.
concurrency:
  group: reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REMINDER_SCHEDULE: ${{ github.event.schedule }}
          REMINDER_SLOT: ${{ inputs.slot }}
        run: node scripts/reminder.ts --decide
      # The step name is how later runs tell that this one posted (SEND_STEP in scripts/reminder.ts).
      - name: Send the reminder
        if: steps.decide.outputs.send == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REMINDER_SCHEDULE: ${{ github.event.schedule }}
          REMINDER_SLOT: ${{ inputs.slot }}
        run: node scripts/reminder.ts

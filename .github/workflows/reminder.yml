name: Daily reminder

# Posts a short reminder to the owner's Discord channel twice a day: 08:00 and 21:00 IST
# (02:30 and 15:30 UTC; India has no daylight saving). GitHub notes scheduled runs can be
# delayed when Actions is busy, and in a public repo they pause after 60 days with no activity
# (re-enable from the Actions tab). The cron lines must match CRON in src/reminder/message.ts.
on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: Which message to send
        type: choice
        options: [morning, evening]
        default: morning

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Send the reminder
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REMINDER_SCHEDULE: ${{ github.event.schedule }}
          REMINDER_SLOT: ${{ inputs.slot }}
        run: node scripts/reminder.ts
